[package]
name = "radio-engine"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = {version="0.6",features=["fs"]}
tokio = { version = "1", features = ["full"] }

[build-dependencies]
cc = "1"

[profile.test]
opt-level = 3

[dev-dependencies]
tokio-tungstenite = "0.29"
futures-util = "0.3"
