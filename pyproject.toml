[project]
name = "amateur-radio-tools"
version = "0.1.0"
description = "Local, evidence-first analysis of SDR audio recordings"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "typer",
    "pydantic",
    "fastapi>=0.149.0",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "websockets>=17.3",
]

[project.scripts]
radio = "radio_tools.cli:app"
radio-monitor = "radio_tools.monitor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radio_tools"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
