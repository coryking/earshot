[project]
name = "amateur-radio-tools"
version = "0.1.0"
description = "Local, evidence-first analysis of SDR audio recordings"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "matplotlib", "typer", "pydantic"]

[project.scripts]
radio = "radio_tools.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radio_tools"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
